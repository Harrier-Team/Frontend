<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel de monitoramento de motores, sensores e telemetria do Hackatohm."
    />
    <title>Harrier | Telemetria de motores</title>
    <style>
      html { background: #0b0d10; }
      html[data-theme='light'] { background: #f3f4f6; }
    </style>
    <script>
      // Aplica o tema salvo antes da primeira pintura, para não piscar escuro no tema claro.
      try {
        if (localStorage.getItem('harrier:tema') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f4f6');
        }
      } catch (erro) {
        /* armazenamento bloqueado: segue no tema escuro */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
